[package]
name = "copilot_proxy"
version = "1.0.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
rcgen = { version = "0.14.8", features = ["x509-parser"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter"] }
